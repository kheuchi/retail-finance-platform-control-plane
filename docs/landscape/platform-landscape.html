<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: a landscape map. Sticky control bar (views, run steps, inspector), then full-width bands; each band = label + wrapping groups of tiles. */
:root {
  --bg: #f3f5f4; --paper: #ffffff; --ink: #14202a; --muted: #5b6b74; --line: #d5dcdc; --focus: #0b6e8a;
  --people: #a86a00; --agent: #6d3fd1; --gate: #c25a00; --data: #1f5fbf; --ml: #0f7a6c; --know: #b3246b; --base: #4a5866;
  --ok: #1d7a43; --part: #a87b00; --gap: #b4372f; --rev: #2d6fb5;
  --tint: 9%;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --paper: #172025; --ink: #e6ecee; --muted: #9aabb3; --line: #2b383e; --focus: #5fc3df;
  --people: #e0a33a; --agent: #a98bf2; --gate: #f08a3c; --data: #6aa3f2; --ml: #4cc1b0; --know: #ec74ad; --base: #9aa9b6;
  --ok: #4cc37f; --part: #e2b53c; --gap: #f07a70; --rev: #6aa8ee; --tint: 16%; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1518; --paper: #172025; --ink: #e6ecee; --muted: #9aabb3; --line: #2b383e; --focus: #5fc3df;
  --people: #e0a33a; --agent: #a98bf2; --gate: #f08a3c; --data: #6aa3f2; --ml: #4cc1b0; --know: #ec74ad; --base: #9aa9b6;
  --ok: #4cc37f; --part: #e2b53c; --gap: #f07a70; --rev: #6aa8ee; --tint: 16%; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto }
header.top { padding-block: 22px 10px }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3vw, 34px); letter-spacing: -0.01em; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 90ch }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgb(0 0 0 / 0.04) }
.bar .wrap { padding-block: 10px; display: grid; gap: 8px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.lbl { font: 600 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px }
.tab, .step { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.step[aria-pressed="true"] { border-color: var(--agent); background: color-mix(in srgb, var(--agent) var(--tint), var(--paper)); box-shadow: inset 0 0 0 1px var(--agent) }
.step b { font-family: var(--f-mono); font-weight: 500; margin-right: 4px; color: var(--agent) }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.insp { min-height: 38px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 10px }
.insp strong { color: var(--ink); font-weight: 600 }
.insp .k { font-family: var(--f-mono); font-size: 12px }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted) }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px }
main .wrap { padding-block: 14px 40px; display: grid; gap: 12px }
.band { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px }
.band > h2 { margin: 0; font: 700 15px var(--f-display); letter-spacing: .01em; color: var(--c); border-right: 3px solid var(--c); padding-right: 10px; display: flex; flex-direction: column; gap: 4px }
.band > h2 small { font: 400 12px var(--f-body); color: var(--muted); letter-spacing: 0 }
.groups { display: flex; flex-wrap: wrap; gap: 10px; min-width: 0 }
.group { flex: 0 1 auto; min-width: 0; border: 1px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 6px; padding: 6px 8px 8px }
.group h3 { margin: 0 0 6px; font: 600 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--c) }
.tiles { display: flex; flex-wrap: wrap; gap: 6px }
.tile { position: relative; text-align: left; width: 168px; min-height: 58px; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); background: color-mix(in srgb, var(--c) var(--tint), var(--paper)); color: var(--ink); border-radius: 5px; padding: 6px 8px 6px 9px; cursor: pointer; font: inherit; transition: opacity .15s, transform .15s }
.tile .n { display: block; font-weight: 600; font-size: 13px; line-height: 1.2; padding-right: 14px }
.tile .n.mono { font-family: var(--f-mono); font-weight: 500; font-size: 12px; word-break: break-word }
.tile .c { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px }
.tile .s { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50% }
.tile .st { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--agent); margin-top: 3px }
.tile.gap { border-style: dashed; background: var(--paper) }
.tile[aria-current="true"] { box-shadow: 0 0 0 2px var(--focus) }
body.focusing .tile:not(.on) { opacity: .25 }
body.focusing .tile.on { box-shadow: 0 0 0 2px var(--agent); transform: translateY(-1px) }
.s-built { background: var(--ok) } .s-part { background: var(--part) } .s-gap { background: var(--gap) } .s-rev { background: var(--rev) } .s-here { background: var(--ok) } .s-target { background: var(--line); box-shadow: inset 0 0 0 1px var(--muted) }
table.ev { width: 100%; border-collapse: collapse; font-size: 13px }
.evwrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px }
.ev th { text-align: left; font: 600 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper) }
.ev td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
.ev td.layer { font: 700 14px var(--f-display); color: var(--c); border-left: 3px solid var(--c); white-space: nowrap }
.ev td.q { font-weight: 600 }
.ev td.i { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums }
.ev td.t { color: var(--muted) }
.note { color: var(--muted); font-size: 12px }
@media (max-width: 760px) {
  .band { grid-template-columns: minmax(0, 1fr) } .band > h2 { border-right: 0; border-bottom: 3px solid var(--c); padding: 0 0 6px }
  .tile { width: calc(50% - 3px) }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none } }
</style>

    { h: "Around everything", sm: "identity, compute, monitoring, governance", c: "base", g: [

      ["Compute and network", [T("Streams", "MSK + Flink", "target"), T("Databricks", "jobs, serverless SQL", "here"), T("GPU endpoint", "the SLM", "target"), T("Private endpoints", "EU regions only", "here")]],
      ["Observability and evaluation", [T("OpenTelemetry traces", "every step, tool call, token", "target"), T("Golden sets", "release gate for RAG and agent", "target"), T("SLOs + alerts", "with owners", "target")]],
      ["Governance and cost", [T("Audit trail", "every claim replayable", "here"), T("Budgets per team", "in the AI gateway", "target"), T("Release gates", "CI/CD", "here")]],
    ]},
  ],
},
eval: {
  sub: "How we would know each part works: the plain question, how we check it, and the indicator we track. Tests run on every PR, evaluations on every release, the same indicators in production. Targets are examples.",
  legend: [["s-built", "in place today"], ["s-part", "partly"], ["s-gap", "not yet"]],
  rows: [
    ["Data pipes", "data", [
      ["Did today's data arrive on time?", "Freshness check on Bronze (Lakehouse Monitoring or SQL alert)", "by 07:00 on 99% of days", "gap"],
      ["Is anything lost or duplicated?", "Row counts source → Bronze → Silver; key uniqueness", "lost = 0 · duplicates = 0", "built"],
      ["Are the numbers right?", "Quality gates + GL vs POS reconciliation", "gates 100% · gap EUR 0", "built"],
      ["Can consumers trust Gold today?", "Certification row per run", "certified before read: 100%", "built"]]],
    ["ML models", "ml", [
      ["Is the forecast better than a simple rule?", "Backtest vs seasonal baseline in MLflow", "model MAPE < baseline", "built"],
      ["Do the detectors find real cases?", "Planted or confirmed cases at the top", "precision@10 · confirmed ≥ 20%", "part"],
      ["Has the input data changed?", "PSI per feature", "PSI < 0.2", "built"],
      ["Is the model still accurate?", "Forecast vs actuals; registry age", "retrained < 2 months", "gap"]]],
    ["RAG", "know", [
      ["Does it find the right clause?", "Golden questions with the expected passage (Ragas, MLflow evaluate)", "top-5 recall ≥ 90%", "gap"],
      ["Is the answer backed by its source?", "Citation check + faithfulness judge", "citations 100% · faithful ≥ 95%", "gap"],
      ["Can someone read a contract they shouldn't?", "Query as a user without rights", "leaks = 0", "gap"]]],
    ["GraphRAG", "know", [
      ["Are suppliers, contracts, claims linked right?", "Extraction vs hand-checked sample", "entity F1 ≥ 0.9", "gap"],
      ["Do multi-hop answers match the truth?", "Questions SQL can answer, compared", "exact match ≥ 90%", "gap"]]],
    ["Agent", "agent", [
      ["Did it use the right tools, in order?", "Trace check on golden cases", "required tools 100%", "part"],
      ["Did it invent any number?", "Figure check against tool results", "grounded 100%", "built"],
      ["Did it cover what matters?", "Keywords, then LLM judge; a person samples", "coverage ≥ 90% · judge ≥ 4/5", "gap"],
      ["Can it be tricked?", "Prompt-injection and unapproved-send tests", "resisted 100%", "part"],
      ["Is it fast, reliable and cheap?", "Traces: OpenTelemetry → Cloud Trace, MLflow or Langfuse", "success ≥ 95% · p95 < 5 min · < EUR 0.50", "part"]]],
    ["Business", "people", [
      ["Is it useful to the controller?", "Approvals table with reasons", "approved without edits ≥ 60%", "part"],
      ["Is it on time, does it save time?", "Run and approval timestamps", "ready by close day 2", "gap"]]],
  ],
},
};

const board = document.getElementById("board"), stepsEl = document.getElementById("steps"), insp = document.getElementById("insp");
let view = "built", step = null;
const defaultInsp = () => { insp.innerHTML = view === "eval" ? "<strong>Read each row left to right:</strong> question → check → indicator." : "<strong>Tip:</strong> pick a step to light up the parts it uses; pick a tile for detail."; };

function render() {
  const v = VIEWS[view];
  document.getElementById("sub").textContent = v.sub;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === view));
  document.getElementById("legend").innerHTML = v.legend.map(([k, l]) => `<span><span class="dot ${k}"></span>${l}</span>`).join("");
  step = null; document.body.classList.remove("focusing");
  stepsEl.innerHTML = "";
  if (v.steps) {
    stepsEl.insertAdjacentHTML("beforeend", '<span class="lbl">One run</span>');
    v.steps.forEach(([n, l]) => stepsEl.insertAdjacentHTML("beforeend", `<button class="step" aria-pressed="false" data-step="${n}"><b>${n}</b>${l}</button>`));
  }
  stepsEl.hidden = !v.steps;
  board.innerHTML = view === "eval" ? evalHTML(v) : v.bands.map(bandHTML).join("");
  defaultInsp();
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
let tileIx = [];
function bandHTML(b, bi) {
  const col = `var(${C[b.c]})`;
  return `<section class="band" style="--c:${col}"><h2>${esc(b.h)}<small>${esc(b.sm)}</small></h2><div class="groups">` +
    b.g.map(([gh, tiles]) => `<div class="group"><h3>${esc(gh)}</h3><div class="tiles">` + tiles.map(t => {
      tileIx.push(t); const id = tileIx.length - 1;
      return `<button class="tile${t.s === "gap" ? " gap" : ""}" data-i="${id}" data-st="${t.st.join(" ")}"><span class="n${t.m ? " mono" : ""}">${esc(t.n)}</span><span class="c">${esc(t.c)}</span>${t.st.length ? `<span class="st">step ${t.st.join(", ")}</span>` : ""}<span class="s s-${t.s}" aria-hidden="true"></span></button>`;
    }).join("") + `</div></div>`).join("") + `</div></section>`;
}
function evalHTML(v) {
  const label = { built: "in place", part: "partly", gap: "not yet" };
  return `<div class="evwrap"><table class="ev"><thead><tr><th>Layer</th><th>The question</th><th>How we check it</th><th>Indicator · target</th><th>Today</th></tr></thead><tbody>` +
    v.rows.map(([layer, c, rows]) => rows.map((r, i) => `<tr style="--c:var(${C[c]})">${i === 0 ? `<td class="layer" rowspan="${rows.length}">${layer}</td>` : ""}<td class="q">${esc(r[0])}</td><td class="t">${esc(r[1])}</td><td class="i">${esc(r[2])}</td><td><span class="dot s-${r[3]}"></span>${label[r[3]]}</td></tr>`).join("")).join("") +
    `</tbody></table></div><p class="note">SLI = what we measure (share of runs that succeed). SLO = its target (≥ 95%). KPI = the business result (drafts approved without edits).</p>`;
}
stepsEl.addEventListener("click", e => {
  const b = e.target.closest(".step"); if (!b) return;
  const n = b.dataset.step; step = step === n ? null : n;
  stepsEl.querySelectorAll(".step").forEach(s => s.setAttribute("aria-pressed", s.dataset.step === step));
  document.body.classList.toggle("focusing", !!step);
  board.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", !!step && t.dataset.st.split(" ").includes(step)));
  if (step) insp.innerHTML = `<strong>Step ${n}.</strong> ${esc(VIEWS[view].steps[+n - 1][1])}`; else defaultInsp();
});
board.addEventListener("click", e => {
  const b = e.target.closest(".tile"); if (!b) return;
  board.querySelectorAll('.tile[aria-current="true"]').forEach(t => t.removeAttribute("aria-current"));
  b.setAttribute("aria-current", "true");
  const t = tileIx[+b.dataset.i];
  insp.innerHTML = `<strong class="${t.m ? "k" : ""}">${esc(t.n)}</strong> · ${esc(t.c)}${t.d ? " · " + esc(t.d) : ""}${t.st.length ? ` <span class="k">(step ${t.st.join(", ")})</span>` : ""}`;
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { location.hash = t.dataset.view; }));
function fromHash() { const h = location.hash.slice(1); view = VIEWS[h] ? h : "built"; tileIx = []; render(); }
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
