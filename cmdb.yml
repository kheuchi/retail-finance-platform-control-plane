# ──────────── findings ────────────
findings:
  - id: F-1
    severity: Critical
    status: Accepted, open
    summary: GitHub 2FA off on the account that owns both repos
    note: Owner decision 2026-09-21 (D-017). Branch protection does not mitigate it.
  - id: F-2
    severity: Medium (was Critical)
    status: Largely resolved 2026-09-21
    summary: Unreviewed pushes to main
    note: Infra repo public; branch protection enforced for admins; required approvals 0 (single maintainer).
  - id: F-3
    severity: High
    status: Open
    summary: No alarm on audit-trail tampering or IAM changes
  - id: F-4
    severity: Medium
    status: Open
    summary: Account-level S3 public access block not managed

# ──────────── threats ────────────
threats:
  - id: T-01
    threat: GitHub account taken over; attacker merges to main and reaches AWS through the deploy role
    stride: S, E
    severity: Critical
    mitigations: The deploy role is scoped to specific S3, IAM, CloudTrail and Budgets actions and cannot launch
      compute. Trust is pinned to main of one repository by immutable numeric ID. CloudTrail records the result
    residual: 'Two-factor authentication is off by owner decision (F-1), so a password is the only barrier. Branch
      protection does not help here: whoever holds the account can open a pull request and merge it. The role can
      still rewrite IAM, including its own trust policy'
  - id: T-02
    threat: A change reaches main without review
    stride: T, E
    severity: Medium
    mitigations: 'Branch protection enforced on main and applied to administrators: pull request required, Terraform
      checks and Checkov advisory scan must pass, branch must be current, linear history, no force pushes, no deletion'
    residual: Required approvals are zero, because a single maintainer cannot approve their own pull request. A
      self-merge is still unreviewed by a second person
  - id: T-03
    threat: Compromised GitHub Action or npm dependency steals the OIDC token or acts inside the AWS session
    stride: T, E
    severity: High
    mitigations: 'Every action pinned to a full commit SHA rather than a tag. permissions: is minimal per job, and
      id-token: write is granted only where needed. Terraform and Checkov versions pinned'
    residual: 'A pinned action''s own transitive dependencies are not pinned. semantic-release runs with contents:
      write over a large npm dependency tree'
  - id: T-04
    threat: Stolen workstation session credentials
    stride: S
    severity: Medium
    mitigations: Credentials are short-lived and browser-issued; no access keys on disk
    residual: A live session remains usable until it expires. No alarm on an unexpected source address
  - id: T-05
    threat: Break-glass administrator identity abused
    stride: E
    severity: Medium
    mitigations: MFA on the user; every non-read action matches a tested metric filter and drives an alarm to a
      confirmed inbox
    residual: Detection, not prevention. The alarm fires after the act, not instead of it
  - id: T-06
    threat: Root account used
    stride: E
    severity: Low
    mitigations: Root MFA enabled, no root access keys, decision D-007 forbids use, tested alarm on any root activity
    residual: Root can disable the alarm, though doing so is itself a logged event
  - id: T-07
    threat: Audit trail stopped or logs deleted to hide activity
    stride: R, T
    severity: High
    mitigations: Log file validation enabled, bucket versioned, prevent_destroy on the bucket, trail is multi-region
    residual: No alarm on StopLogging, DeleteTrail or event-selector changes. Logs live in the same account as the
      workloads they describe, which only a separate Log Archive account fixes. No S3 Object Lock
  - id: T-08
    threat: IAM quietly changed to widen access
    stride: E
    severity: High
    mitigations: Every IAM change is captured in CloudTrail and in the S3 record
    residual: No alarm on IAM policy or role changes. A widened deploy role would be recorded, but nobody would
      be told
  - id: T-09
    threat: A bucket is exposed publicly
    stride: I
    severity: Medium
    mitigations: All four buckets carry a public access block on all four settings, bucket-owner-enforced ownership
      and a TLS-only policy. Verified directly against AWS
    residual: The account-level public access block is not managed by Terraform. A bucket created outside Terraform
      inherits no guard
  - id: T-10
    threat: Terraform state read by an unauthorised party
    stride: I
    severity: Medium
    mitigations: Private bucket, encrypted at rest, TLS enforced, never committed to Git, and CloudTrail object-level
      events recorded on it
    residual: Encryption uses S3-managed keys, so there is no key-level revocation or independent decryption audit.
      A stale local terraform.tfstate remains on the workstation from before the backend migration
  - id: T-11
    threat: Two applies run at once and corrupt state
    stride: T
    severity: Low
    mitigations: S3 native state locking (use_lockfile=true), and the deploy workflow's concurrency group prevents
      overlapping runs
    residual: A break-glass apply from a workstation bypasses the workflow, though it still takes the lock
  - id: T-12
    threat: 'Denial of wallet: an attacker, or a forgotten resource, burns the budget'
    stride: D
    severity: Medium
    mitigations: Budget alerts at 50% and 80% actual and 100% forecast, to a confirmed inbox. Nothing hourly-billed
      is deployed. The deploy role cannot create compute
    residual: Budget alerts lag real spend by hours. There is no hard stop — an alert is a message, not a brake.
      The budget cannot see Databricks charges at all Since 2026-09-24 the PrivateLink network runs ~USD 64/month,
      above the USD 50 budget if left on after the trial.
  - id: T-13
    threat: Confused deputy on the Databricks cross-account role
    stride: E
    severity: Low
    mitigations: Cross-account role requires sts:ExternalId = our Databricks account ID; Unity Catalog role requires
      the external ID Databricks issued for our credential; root bucket grant requires aws:PrincipalTag/DatabricksAccountId.
    residual: None known. Built and applied 2026-09-24.
  - id: T-14
    threat: Real personal or payment data enters a platform designed for synthetic data
    stride: I
    severity: '*Planned*'
    mitigations: 'Policy only: synthetic data, no real PII or card data'
    residual: Needs a technical control before ingestion begins, not a rule in a document
  - id: T-15
    threat: An agent produces a plausible but wrong finance narrative
    stride: T
    severity: '*Planned*'
    mitigations: None yet
    residual: Requires source citations, deterministic metrics, evaluation and human review before any output is
      trusted
  - id: T-16
    threat: Prompt injection reaching an agent through ingested data
    stride: T, E
    severity: '*Planned*'
    mitigations: None yet
    residual: All ingested content must be treated as untrusted input to the model; agent tools must be read-only
      and separately authorised
  - id: T-17
    threat: Employer cloud credentials on the same workstation are used against this project, or this project's
      commands run against an employer account
    stride: T, E, D
    severity: High
    mitigations: Awareness only. Azure CLI credentials were cleared on 2026-09-22 after being found authenticated
      to an employer tenant with a corporate subscription as the default target
    residual: gcloud still holds three employer service accounts. Git author addresses from two employers were scrubbed
      from history on 2026-09-21. This is the concrete form of the operator-error threat ranked most likely in this
      model, and the damage runs in both directions

