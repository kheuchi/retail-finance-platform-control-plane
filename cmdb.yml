# ──────────── lessons ────────────
lessons:
  - {lesson: 'Grant permissions in one apply, use them in the next (two-phase apply).', story: '1.3'}
  - {lesson: 'Run the IAM policy simulator before applies that need new permissions; test negative cases too.', story: '1.3'}
  - {lesson: 'Some IAM actions have no resource type (DescribeTrails, log deliveries): ''*'' is the only form.', story: '1.3'}
  - {lesson: 'CloudWatch filter ''$.readOnly = false'' parses but never matches; use ''IS FALSE''.', story: '1.4'}
  - {lesson: 'Verify against the remote, not a local clone (orphaned tags after history rewrite).', story: '1.5'}
  - {lesson: 'A Databricks trial credit covers DBUs, never the cloud infrastructure the workspace creates.', story: '2.1'}
  - {lesson: 'Check which cloud account a CLI is pointed at before running anything.', story: '2.1'}
  - {lesson: 'count = 0 hides resources from Checkov; a clean scan of code that creates nothing proves nothing.', story: '2.2'}
  - {lesson: 'Data sources are read at plan time even when unused; gate them too.', story: '2.2'}
  - {lesson: 'Terraform does not store null outputs; read them with try().', story: '2.3'}
  - {lesson: 'When an error blames auth but other resources authenticate, suspect the resource (missing account_id).', story: '2.3'}
  - {lesson: 'Find undocumented API limits with read-only calls, then encode them as preconditions.', story: '2.5'}
  - {lesson: 'Deploy jobs into the service principal''s own folder, never /Workspace/Shared.', story: '3.2'}
  - {lesson: 'When a private network misbehaves, read the VPC flow logs first: REJECT records name the blocked port.', story: '3.3'}
  - {lesson: 'Security groups must allow a flow on both ends; flow logs show which end drops it.', story: '3.3'}
  - {lesson: 'With lazy evaluation every count() re-runs the whole plan; count the table you wrote, not the DataFrame.', story: '4.1'}
  - {lesson: 'Quarantine, never filter: 123 silently dropped rows would have hidden a bug in our own FX table.', story: '4.1'}
  - {lesson: 'Reconcile the way the books were built (convert unrounded, round once per day); then a 1-cent tolerance is honest.', story: '4.2'}
  - {lesson: 'An independent reviewer that sees only the story and diff finds what the author never tested (1 high, 4 medium on 4.2).', story: '4.2'}
  - {lesson: 'Probe the full data before fixing acceptance criteria: it caught a partial month and a criterion the data did not support.', story: '4.3'}
  - {lesson: 'Unity Catalog shows inherited grants on child objects; judge each grant where it was made, or a leak check blocks every run.', story: '4.3'}
  - {lesson: 'Compare money in the currency it was transacted in; FX conversion belongs to reporting, not to integrity checks.', story: '4.4'}
  - {lesson: 'A quality gate must certify the exact data version it checked; record versions at the gate and compare at publish time.', story: '4.4'}
