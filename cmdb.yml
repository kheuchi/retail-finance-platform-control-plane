# ──────────── decisions ────────────
decisions:
  - id: D-001
    decision: 'Use a retail finance department scenario'
    status: 'Accepted'
    reason: 'User-selected business domain'
    story: '3.1'
  - id: D-002
    decision: 'Build the governed cloud foundation before workloads'
    status: 'Accepted'
    reason: 'Establish enterprise controls first'
    story: '1.1'
  - id: D-003
    decision: 'Use Terraform for reproducible infrastructure'
    status: 'Accepted'
    reason: 'User requirement'
    story: '1.1'
  - id: D-004
    decision: 'Use AWS Databricks for the lakehouse and ML platform'
    status: 'Accepted'
    reason: 'User requirement'
    story: '2.1'
  - id: D-005
    decision: 'Keep project context agent-agnostic'
    status: 'Accepted'
    reason: 'Supports multiple tools and human handoff'
    story: 'X.1'
  - id: D-006
    decision: 'Use AWS Control Tower versus a custom landing zone'
    status: 'Deferred by D-009'
    reason: 'Requires account, budget and constraint discovery'
    story: '1.1'
  - id: D-007
    decision: 'Prohibit root identity for project operations'
    status: 'Accepted'
    reason: 'Root can do anything; reserved for root-only recovery tasks'
    story: '1.1'
  - id: D-008
    decision: 'One-week initial delivery window'
    status: 'Accepted'
    reason: 'User constraint; requires a thin end-to-end slice and documented future roadmap'
  - id: D-009
    decision: 'Preserve Free plan; do not deploy Organizations or Control Tower'
    status: 'Accepted'
    reason: 'Organizations or Control Tower would end the USD 100 credit; multi-account kept as a reference design'
    story: '1.1'
  - id: D-010
    decision: 'Use eu-west-3 as primary project region'
    status: 'Superseded'
    reason: 'Basic Databricks support exists, but custom model/agent serving is unavailable'
    story: '1.1'
  - id: D-011
    decision: 'Separate control plane, infrastructure, data, ML, and agent repositories'
    status: 'Accepted'
    reason: 'Independent ownership, permissions, CI/CD, state, and release lifecycles'
    story: '3.2'
  - id: D-012
    decision: 'Use eu-central-1 for workloads/AI; retain state in eu-west-3'
    status: 'Superseded'
    reason: 'The split was safe but added needless complexity at this early project stage'
    story: '1.1'
  - id: D-013
    decision: 'Standardize all regional resources on eu-central-1'
    status: 'Accepted'
    reason: 'One region is simpler; the needed Databricks and Bedrock features are available'
    story: '1.1'
  - id: D-014
    decision: 'Sign up for the Databricks free trial through AWS Marketplace rather than directly on databricks.com'
    status: 'Superseded by D-014b'
    reason: 'Databricks charges on the AWS bill, inside the AWS Budget. Blocked on the Free plan'
    story: '2.1'
  - id: D-015
    decision: 'Use a serverless Databricks workspace rather than a classic workspace'
    status: 'Superseded by D-015b'
    reason: 'Avoid the hourly NAT cost of a classic workspace'
    story: '2.1'
  - id: D-016
    decision: 'Publish retail-finance-platform-infra, accepting exposure of the AWS account identifier'
    status: 'Accepted'
    reason: 'Free branch protection, secret scanning and push protection; an account ID is not a credential'
    story: '1.5'
  - id: D-014b
    decision: 'Sign up for Databricks through AWS Marketplace'
    status: 'Accepted'
    reason: 'Paid plan unblocked Marketplace; charges land on the AWS bill'
    story: '2.1'
  - id: D-015b
    decision: 'Use a classic workspace in a customer-managed VPC, not serverless'
    status: 'Accepted'
    reason: 'Serverless shows none of the network controls this project exists to evidence'
    story: '2.1'
  - id: D-018
    decision: 'Upgrade the AWS account from the Free plan to the Paid plan'
    status: 'Accepted'
    reason: 'Free plan blocks Marketplace and deletes everything when credits end; credits carry over'
    story: '2.1'
  - id: D-019
    decision: 'Build the Databricks VPC in the fully-private shape, with no NAT gateway'
    status: 'Accepted'
    reason: 'No public egress path at all. The early estimate (~15 vs ~32/month) predates PrivateLink; actual ~64 vs ~38 (D-021)'
    story: '2.1'
  - id: D-020
    decision: 'Reject Azure and GCP as the Databricks host'
    status: 'Accepted'
    reason: 'Azure trial forces a NAT (hybrid workspace); GCP classic compute runs on deprecated GKE'
    story: '2.1'
  - id: D-017
    decision: 'Leave GitHub two-factor authentication disabled for now'
    status: 'Accepted'
    reason: 'Owner decision 2026-09-21; highest-severity open risk (R-01)'
    story: '1.5'
  - id: D-021
    decision: 'Databricks Enterprise tier with back-end PrivateLink'
    status: 'Accepted'
    date: '2026-09-24'
    reason: 'PrivateLink needs Enterprise; the only design with literally no public egress (~USD 64 vs ~38/month)'
    story: '2.1'
  - id: D-022
    decision: 'Manage Databricks in a separate Terraform stack (databricks/)'
    status: 'Accepted'
    date: '2026-09-24'
    reason: 'Smaller blast radius, separate credentials and lifecycle; reads bootstrap outputs, never the reverse'
    story: '2.3'
  - id: D-023
    decision: 'Terraform authenticates to Databricks as a service principal (OAuth M2M), 14-day secret'
    status: 'Accepted'
    date: '2026-09-24'
    reason: 'Everything in code; secret lifetime matches the trial. Target: GitHub OIDC federation'
    story: '2.3'
  - id: D-025
    decision: 'Generate the accounting data synthetically; real inputs only for ECB FX rates and holidays'
    status: 'Accepted'
    date: '2026-09-25'
    reason: 'No public dataset has ledger + budget + cashier refunds; planted anomalies give ground truth; no internet in the VPC'
    story: '3.1'
  - id: D-026
    decision: 'Data code lives in a separate public repo, retail-finance-data-products'
    status: 'Accepted'
    date: '2026-09-25'
    reason: 'Per D-011; public for free branch protection and secret scanning'
    story: '3.2'
  - id: D-027
    decision: 'Make retail-finance-platform-control-plane public'
    status: 'Accepted'
    date: '2026-09-26'
    reason: 'Architecture, stories and security docs must be visible to portfolio readers; history scanned clean first'
    story: '1.5'
  - id: D-028
    decision: 'AGENTS.md holds the rules for any assistant; PROJECT_CONTEXT.md retired into AGENTS.md and STATUS.md'
    status: 'Accepted'
    date: '2026-09-27'
    reason: 'Tools auto-load AGENTS.md or CLAUDE.md, not PROJECT_CONTEXT.md; its state section had gone stale next to STATUS.md; working rules lived only in one assistant''s memory'
    story: 'X.1'
  - id: D-024
    decision: 'Markdown stays short and human-readable; detail lives in cmdb.yml'
    status: 'Accepted'
    date: '2026-09-25'
    reason: 'Long prose docs were hard to read; full versions stay in Git history'
    story: 'X.1'

