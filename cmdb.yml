# ──────────── architecture ────────────
architecture:
  docs: docs/architecture/ (hld.md + lld-*.md, each with .drawio source and exported .png)
  diagrams:
    - {file: hld, covers: 'GitHub, AWS foundation, Databricks VPC, data buckets, Databricks control plane, planned ML and agent'}
    - {file: lld-network, covers: 'VPC 10.20.0.0/16, 2 AZ x (workspace /22 + endpoint /24), 4 interface + 1 gateway endpoint, SG rules, cost'}
    - {file: lld-identity-cicd, covers: 'PR -> checks -> gated deploy; OIDC plan/deploy roles; cross-account and UC roles with external IDs; service principal; groups'}
    - {file: lld-data-platform, covers: 'generate -> landing volume -> Auto Loader -> Bronze (done) -> Silver (next) -> Gold (planned); catalog layout; grants'}
    - {file: lld-observability-cost, covers: 'CloudTrail, audit bucket, metric filters, alarms, SNS; flow logs; budgets, cluster policies, serverless egress; change gates'}
  planned: [lld-ml, lld-agent]
  key_flows:
    - login: browser -> workspace over HTTPS (only internet path)
    - control: cluster -> PrivateLink (443, 6666, 8443-8451) -> Databricks control plane
    - data: cluster -> S3 gateway endpoint -> dbx-uc
    - infra_change: GitHub Actions -> OIDC -> github-plan / github-deploy
    - job_change: GitHub Actions -> OAuth service principal -> bundle deploy
  toolchain:
    drawio: draw.io desktop, installed 2026-09-26 via 'winget install --id JGraph.Draw --scope user'
    export: DrawIO.exe --export --format png --scale 1.5 --border 20 --output <abs path>.png <abs path>.drawio
    gotchas:
      - Export needs absolute Windows paths; relative paths silently produce nothing
      - Back-to-back exports from one Git Bash loop can silently fail; run one process at a time (Start-Process -Wait)
      - 'AWS icons that render blank: simple_notification_service, vpc_flow_logs, security_token_service (use sns, flow_logs, sts)'

