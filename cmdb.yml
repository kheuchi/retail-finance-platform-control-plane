about: Inventory for the retail-finance platform program (facts, IDs, status, one-line reasons). Explanations live in docs/stories/.
updated: '2026-09-26'

# ──────────── program ────────────
program:
  name: Retail Finance Data, ML and Agentic AI Platform
  scenario: Accounting department of a large multi-channel retailer (fictional)
  needs:
    - Revenue, refund, cost and gross-margin reporting
    - Actual vs budget variance
    - Store/channel/product profitability
    - Cash-flow and demand forecasting
    - Reconciliation and finance data quality
    - Anomaly detection for refunds and margin leakage
    - Governed natural-language analysis with citations
  agent_boundary: May investigate, summarise and recommend. Never posts journal entries, moves money or approves
    payments without a human.
  cloud:
    aws_region: eu-central-1
    aws_plan: Paid (upgraded 2026-09-22, credits kept)
    budget_usd_month: 50
    databricks:
      tier: Enterprise
      billing: AWS Marketplace
      trial_credit_usd: 400
      trial_ends: '2026-10-06'
      workspace: retail-finance-platform (classic, HYBRID)
      workspace_url: https://dbc-011bcfbf-172d.cloud.databricks.com
      metastore: metastore_aws_eu_central_1

# ──────────── rules ────────────
rules:
  - No secrets, state or account identifiers in Git
  - Short-lived access only; CI uses OIDC
  - No infrastructure change without a reviewed Terraform plan
  - Synthetic data only; no real PII or card data
  - Agents read-only; consequential actions need a human
  - Budgets before spend; tear down after the trial
  - 'Docs: short markdown; cmdb.yml is the inventory (facts, one-line reasons); stories hold the explanations'

